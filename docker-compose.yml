name: keimelion

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ../Keimelion-API
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: 3000
      UPLOADS_DIR: /app/uploads
    volumes:
      - ./data/uploads:/app/uploads
    ports:
      - "127.0.0.1:${API_PORT}:3000"

  back:
    build:
      context: ../Keimelion-Backoffice
      # The back-office imports ../Keimelion-API/src through the tsconfig alias @keimelion/api/*
      additional_contexts:
        api-src: ../Keimelion-API/src
      args:
        # Inlined into the browser bundle at build time: must be reachable from the browser
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # For server-side Next calls, if any (internal Docker network)
      API_URL: http://api:3000
    ports:
      - "127.0.0.1:${BACK_PORT}:3001"

  landing:
    build:
      context: ../Keimelion-Landing
      args:
        PUBLIC_API_BASE_URL: ${PUBLIC_API_URL}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LANDING_PORT}:3002"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - back
      - landing
    ports:
      - "80:80"
    volumes:
      # Mount the whole caddy/ folder (not just the file) so `caddy reload`
      # picks up edits — editors replace the inode on save, which breaks a
      # single-file bind mount.
      - ./caddy:/etc/caddy:ro
      # Read-only: only the API writes uploads
      - ./data/uploads:/srv/uploads:ro
      # Certs + ACME state, unused: TLS is terminated by the NAS reverse proxy
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
