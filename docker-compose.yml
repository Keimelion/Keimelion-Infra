name: keimelion

# Docker keeps container logs forever by default: 3 × 10 MB per service.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    # Exact minor pinned (Dependabot bumps it): a rebuild of the server gets the same
    # binaries as the backups were tested against.
    # Major upgrades are a dump/restore, never a tag bump (docs/runbook.md "Postgres major
    # upgrade"); Dependabot only proposes minors.
    image: postgres:18.6-alpine
    restart: unless-stopped
    logging: *logging
    # Docker's default 64 MB /dev/shm is too small for parallel queries / big sorts.
    shm_size: 256mb
    # Postgres stops on SIGINT (fast shutdown): leave it time to checkpoint instead of
    # being SIGKILLed after Docker's default 10 s (crash recovery on next start).
    stop_grace_period: 1m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Since 18 the image keeps PGDATA in /var/lib/postgresql/<major>/docker: mounting the
      # parent lets a future major sit next to this one (pg_upgrade --link).
      - ./data/postgresql:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: ../Keimelion-API
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: 3000
      UPLOADS_DIR: /app/uploads
    volumes:
      - ./data/uploads:/app/uploads
    ports:
      - "127.0.0.1:${API_PORT}:3000"

  back:
    build:
      context: ../Keimelion-Backoffice
      args:
        # Inlined into the browser bundle at build time: must be reachable from the browser
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
    restart: unless-stopped
    logging: *logging
    depends_on:
      - api
    environment:
      # For server-side Next calls, if any (internal Docker network)
      API_URL: http://api:3000
    ports:
      - "127.0.0.1:${BACK_PORT}:3001"

  landing:
    build:
      context: ../Keimelion-Landing
      args:
        PUBLIC_API_BASE_URL: ${PUBLIC_API_URL}
    restart: unless-stopped
    logging: *logging
    depends_on:
      - api
    environment:
      # Server-side waitlist calls stay on the Docker network: through Caddy, the visitor IP
      # the landing forwards would be replaced by its own and all visitors share one rate limit
      API_INTERNAL_URL: http://api:3000
    ports:
      - "127.0.0.1:${LANDING_PORT}:3002"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      - api
      - back
      - landing
    ports:
      - "80:80"
    volumes:
      # Mount the whole caddy/ folder (not just the file) so `caddy reload`
      # picks up edits — editors replace the inode on save, which breaks a
      # single-file bind mount.
      - ./caddy:/etc/caddy:ro
      # Read-only: only the API writes uploads
      - ./data/uploads:/srv/uploads:ro
      # Certs + ACME state, unused: TLS is terminated by the NAS reverse proxy
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
