version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
  # Pinned images of docker-compose.yml (postgres minor, caddy)
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A Postgres major is a dump/restore (docs/runbook.md "Postgres major upgrade")
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope
