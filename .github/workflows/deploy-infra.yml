name: deploy-infra

# Applies this repo on milky-way after a merge on main, to the pre-prod then to the production
# (a pre-prod failure stops there): pull the stack's Keimelion-Infra checkout,
# `docker compose up -d` (recreates only the services whose config changed, never rebuilds
# the app images — their own deploy does), reload Caddy if its config changed, then health
# check every public URL; rollback to the previous commit on failure.
# .env and data/ are untracked: never touched. A restic snapshot is taken before applying.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Apply Infra (${{ matrix.environment }})
    runs-on: [self-hosted, keimelion]
    timeout-minutes: 15
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        environment: [preprod, production]
    concurrency:
      group: deploy-${{ matrix.environment }}-${{ github.repository }}
      cancel-in-progress: false
    env:
      DEPLOY_ENV: ${{ matrix.environment }}
    steps:
      - name: Resolve environment
        run: |
          case "$DEPLOY_ENV" in
            preprod)
              INFRA_DIR=$HOME/keimelion/Keimelion-Infra; BACKUP_UNIT_PREFIX=keimelion; CADDY_DIR=caddy/
              URLS="https://api.keimelion.zalbani.dev/health https://admin.keimelion.zalbani.dev/ https://keimelion.zalbani.dev/" ;;
            production)
              INFRA_DIR=/home/zalbani/keimelion-prod/Keimelion-Infra; BACKUP_UNIT_PREFIX=keimelion-prod; CADDY_DIR=caddy-prod/
              URLS="https://api.keimelion.app/health https://admin.keimelion.app/ https://keimelion.app/" ;;
          esac
          {
            echo "INFRA_DIR=$INFRA_DIR"
            echo "BACKUP_UNIT_PREFIX=$BACKUP_UNIT_PREFIX"
            echo "CADDY_DIR=$CADDY_DIR"
            echo "HEALTH_URLS=$URLS"
          } >> "$GITHUB_ENV"

      - name: Detect new version
        id: version
        run: |
          # Bootstrap: without outputs every following step skips (docs/runbook.md "Production stack").
          if [ ! -f "$INFRA_DIR/.env" ]; then
            echo "::notice::No stack in $INFRA_DIR, nothing to apply"
            exit 0
          fi
          cd "$INFRA_DIR"
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::Tracked files edited by hand on the server, commit them or discard them first:"
            git status --short --untracked-files=no
            exit 1
          fi
          git fetch --prune origin main
          git checkout -q main
          PREV=$(git rev-parse HEAD)
          NEXT=$(git rev-parse origin/main)
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          if [ "$PREV" = "$NEXT" ]; then
            echo "::notice::Already at $NEXT, nothing to apply"
            exit 0
          fi
          if git diff --quiet "$PREV" "$NEXT" -- "$CADDY_DIR"; then
            echo "caddy=false" >> "$GITHUB_OUTPUT"
          else
            echo "caddy=true" >> "$GITHUB_OUTPUT"
          fi
          echo "::notice::Keimelion-Infra ${PREV:0:7} -> ${NEXT:0:7} ($DEPLOY_ENV)"
          git diff --stat "$PREV" "$NEXT"

      # A compose change can recreate postgres (image bump, settings): snapshot first.
      # Warning only while scripts/backup/install.sh has not run yet (bootstrap: the units
      # are installed from this checkout, after the merge that brings them).
      - name: Pre-deploy backup
        if: steps.version.outputs.prev != steps.version.outputs.next
        run: |
          if [ ! -f "/etc/systemd/system/$BACKUP_UNIT_PREFIX-db-backup@.service" ]; then
            echo "::warning::Backups not installed on the server (sudo scripts/backup/install.sh), applying without a snapshot"
            exit 0
          fi
          if ! sudo -n systemctl start --wait "$BACKUP_UNIT_PREFIX-db-backup@pre-deploy.service"; then
            journalctl -u "$BACKUP_UNIT_PREFIX-db-backup@pre-deploy.service" -n 40 --no-pager || true
            echo "::error::Pre-deploy backup failed, apply aborted (nothing changed yet)"
            exit 1
          fi

      - name: Apply
        if: steps.version.outputs.prev != steps.version.outputs.next
        run: |
          cd "$INFRA_DIR"
          git reset -q --hard "${{ steps.version.outputs.next }}"
          docker compose up -d --no-build
          if [ "${{ steps.version.outputs.caddy }}" = "true" ]; then
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
          fi

      - name: Health check
        if: steps.version.outputs.prev != steps.version.outputs.next
        run: |
          sleep 5
          for url in $HEALTH_URLS; do
            ok=false
            for _ in $(seq 1 30); do
              if curl -fsS -o /dev/null --max-time 5 "$url"; then ok=true; break; fi
              sleep 3
            done
            if [ "$ok" != true ]; then
              echo "::error::Health check failed on $url"
              exit 1
            fi
            echo "::notice::$url OK"
          done

      - name: Rollback on failure
        if: failure() && steps.version.outputs.prev != '' && steps.version.outputs.prev != steps.version.outputs.next
        run: |
          echo "::warning::Rolling Keimelion-Infra back to ${{ steps.version.outputs.prev }} ($DEPLOY_ENV)"
          cd "$INFRA_DIR"
          git reset -q --hard "${{ steps.version.outputs.prev }}"
          docker compose up -d --no-build
          docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
