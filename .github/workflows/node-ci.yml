name: node-ci

# Reusable quality gate, identical for every Keimelion app repo:
# npm ci, then `lint typecheck test build` (a script the repo doesn't define is skipped).
# Build-time env comes from the repo's `.env.example`.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use .env.example as build env
        run: if [ -f .env.example ]; then cp .env.example .env; fi

      - name: Run scripts
        run: |
          for script in lint typecheck test build; do
            echo "::group::npm run $script"
            npm run "$script" --if-present
            echo "::endgroup::"
          done
