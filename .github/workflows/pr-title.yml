name: pr-title

# PRs are squash-merged, so the PR title becomes the commit semantic-release analyses:
# it must follow Conventional Commits.

on:
  workflow_call:

permissions:
  pull-requests: read

jobs:
  lint:
    name: Conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
