name: dependabot-automerge

# Squash-merges a Dependabot PR once its CI passed (the caller runs this job with
# `needs:` on its checks) when the update is a semver patch or minor. Majors are left
# open for a manual review, and so is any Keimelion-Infra update, whatever its type: PR CI
# does not exercise release, deploy or npm-publish.

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Auto-merge patch/minor
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Merge
        if: >-
          !contains(steps.meta.outputs.dependency-names, 'Keimelion/Keimelion-Infra') && (
            steps.meta.outputs.update-type == 'version-update:semver-patch' ||
            steps.meta.outputs.update-type == 'version-update:semver-minor'
          )
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "$PR_URL" --squash --delete-branch

      - name: Leave majors and Keimelion-Infra updates for review
        if: >-
          contains(steps.meta.outputs.dependency-names, 'Keimelion/Keimelion-Infra') ||
          steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          DEPS: ${{ steps.meta.outputs.dependency-names }}
        run: echo "::notice::Manual review required ($DEPS)"
