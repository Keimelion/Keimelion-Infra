name: deploy

# Reusable deploy of the calling repo's compose service on milky-way (self-hosted
# runner). The repo → service mapping lives here, next to docker-compose.yml; the steps
# are scripts/deploy/app-deploy.sh (rehearsable outside CI). For the API:
#   snapshot → migrations with the new image while the current API serves (a failure
#   changes nothing, the schema is transactional) → swap → health + smoke tests →
#   on failure: previous image back instantly, checked; if it is unhealthy on a schema
#   this deploy migrated, the pre-deploy snapshot is restored. docs/runbook.md
#   "Deploy, migrations & rollback".
#
# Two stacks: preprod (`dev`, *.keimelion.zalbani.dev) and production (`main`, keimelion.app).

on:
  workflow_call:
    inputs:
      environment:
        description: preprod or production
        type: string
        default: preprod

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: [self-hosted, keimelion]
    timeout-minutes: 20
    concurrency:
      group: deploy-${{ inputs.environment }}-${{ github.repository }}
      cancel-in-progress: false
    env:
      REPO_DIR: ${{ github.event.repository.name }}
      DEPLOY_ENV: ${{ inputs.environment }}
    steps:
      - name: Resolve service
        run: |
          # Absolute: CI, systemd and manual commands must share one path, Compose hashes it.
          case "$DEPLOY_ENV" in
            preprod)
              BRANCH=dev;  STACK_DIR=/home/zalbani/keimelion-integration; BACKUP_UNIT_PREFIX=keimelion
              API=https://api.keimelion.zalbani.dev; ADMIN=https://admin.keimelion.zalbani.dev; LANDING=https://keimelion.zalbani.dev ;;
            production)
              BRANCH=main; STACK_DIR=/home/zalbani/keimelion-prod; BACKUP_UNIT_PREFIX=keimelion-prod
              API=https://api.keimelion.app; ADMIN=https://admin.keimelion.app; LANDING=https://keimelion.app ;;
            *) echo "::error::Unknown environment $DEPLOY_ENV"; exit 1 ;;
          esac
          # First URL: health endpoint (waited for); the others: smoke tests reading real
          # tables, so that a release unable to run on the schema is caught (/health only
          # runs SELECT 1).
          case "$REPO_DIR" in
            Keimelion-API)        SERVICE=api;     URLS="$API/health $API/v1/categories $API/v1/occasion-types" ;;
            Keimelion-Backoffice) SERVICE=back;    URLS=$ADMIN/ ;;
            Keimelion-Landing)    SERVICE=landing; URLS=$LANDING/ ;;
            *) echo "::error::No compose service mapped for $REPO_DIR"; exit 1 ;;
          esac
          {
            echo "BRANCH=$BRANCH"
            echo "STACK_DIR=$STACK_DIR"
            echo "BACKUP_UNIT_PREFIX=$BACKUP_UNIT_PREFIX"
            echo "DEPLOY=$STACK_DIR/Keimelion-Infra/scripts/deploy/app-deploy.sh"
            echo "SERVICE=$SERVICE"
            echo "HEALTH_URLS=$URLS"
          } >> "$GITHUB_ENV"

      - name: Detect new version
        id: version
        run: |
          cd "$STACK_DIR/$REPO_DIR"
          # HEAD is what was last deployed, whichever branch it is on. Switching to the deploy
          # branch first would compare it with itself and skip a deploy after a branch change.
          PREV=$(git rev-parse HEAD)
          git fetch --prune origin "$BRANCH"
          NEXT=$(git rev-parse "origin/$BRANCH")
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "::notice::$REPO_DIR @ $BRANCH ($DEPLOY_ENV)"
          echo "  from: $PREV"
          echo "  to:   $NEXT"
          if [ "$PREV" = "$NEXT" ]; then
            echo "::notice::Already at $NEXT, downstream steps will skip"
          fi

      - name: Pull & build
        if: steps.version.outputs.prev != steps.version.outputs.next
        run: |
          "$DEPLOY" save-image "$SERVICE"
          cd "$STACK_DIR/$REPO_DIR"
          git checkout -f -B "$BRANCH" "${{ steps.version.outputs.next }}"
          cd "$STACK_DIR/Keimelion-Infra"
          docker compose build "$SERVICE"

      # Never migrate without a fresh snapshot to come back to. Runs as the backup user via
      # systemd, allowed by /etc/sudoers.d/<prefix>-backup (scripts/backup/install.sh); the
      # snapshot ID is recorded for the rollback (<prefix>-db-restore@pre-deploy-api).
      - name: Pre-deploy backup
        if: steps.version.outputs.prev != steps.version.outputs.next && env.SERVICE == 'api'
        run: |
          if ! sudo -n systemctl start --wait "$BACKUP_UNIT_PREFIX-db-backup@pre-deploy-api.service"; then
            journalctl -u "$BACKUP_UNIT_PREFIX-db-backup@pre-deploy-api.service" -n 40 --no-pager || true
            echo "::error::Pre-deploy backup failed, deploy aborted (nothing changed yet; sudo scripts/backup/install.sh if the sudoers rule is missing)"
            exit 1
          fi

      - name: Migrate
        id: migrate
        if: steps.version.outputs.prev != steps.version.outputs.next && env.SERVICE == 'api'
        run: '"$DEPLOY" migrate'

      - name: Deploy
        if: steps.version.outputs.prev != steps.version.outputs.next
        run: |
          cd "$STACK_DIR/Keimelion-Infra"
          docker compose up -d "$SERVICE"

      - name: Health check
        if: steps.version.outputs.prev != steps.version.outputs.next
        run: |
          # shellcheck disable=SC2086 # HEALTH_URLS is a space-separated list
          "$DEPLOY" check $HEALTH_URLS

      - name: Rollback on failure
        if: failure() && steps.version.outputs.prev != '' && steps.version.outputs.prev != steps.version.outputs.next
        env:
          SCHEMA_CHANGED: ${{ steps.migrate.outputs.schema_changed }}
        run: |
          echo "::warning::Rolling $REPO_DIR back to ${{ steps.version.outputs.prev }}"
          git -C "$STACK_DIR/$REPO_DIR" reset --hard "${{ steps.version.outputs.prev }}"
          # shellcheck disable=SC2086
          "$DEPLOY" rollback "$SERVICE" $HEALTH_URLS
